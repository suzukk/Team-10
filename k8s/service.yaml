apiVersion: v1
kind: Service
metadata:
  name: realestate-api
  labels:
    app: realestate-api
spec:
  type: NodePort
  selector:
    app: realestate-api
  ports:
    - port: 80          # cluster доторх порт
      targetPort: 3000  # контейнерийн порт
      nodePort: 30080   # node дээр гадагш нээгдэх порт
